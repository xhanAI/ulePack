[project]
name = "ulepack"
version = "0.1.0"
description = "Shrink and convert screen recordings to fit chat-app upload limits (ffmpeg)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Adrian Xhanaj" }]
requires-python = ">=3.12"
dependencies = ["textual>=8.0"]

[project.scripts]
ulepack = "ulepack.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ulepack"]

[tool.uv]
# rebuild on every source edit, so `uv tool install --force .` never reinstalls a stale cached wheel
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*" }]
